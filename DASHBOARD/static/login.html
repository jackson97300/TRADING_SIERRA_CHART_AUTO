<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Dashboard MIA IA SYSTEM Trading Futures</title>
    <meta name="description" content="Connectez-vous a votre dashboard MIA IA SYSTEM. Accedez aux analyses de marche temps reel, briefings quotidiens et alertes trading ES NQ futures.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/static/images/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ---------- Variables ---------- */
        :root {
            --bg-base: #0A0E17;
            --bg-card: #0D1321;
            --bg-input: #131722;
            --cyan: #00B4DC;
            --cyan-dark: #0090B0;
            --gold: #D4AF37;
            --green: #00C853;
            --red: #FF5252;
            --text-primary: #FFFFFF;
            --text-secondary: #CBD5E1;
            --text-muted: #94A3B8;
            --text-disabled: #64748B;
            --glass-bg: rgba(13, 19, 33, 0.8);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-blur: 24px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html { -webkit-font-smoothing: antialiased; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 0.875rem;
            line-height: 1.5;
            color: var(--text-primary);
            background-color: var(--bg-base);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* ---------- Blobs decoratifs ---------- */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
        }

        .blob-cyan {
            top: -10%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: var(--cyan);
            opacity: 0.10;
        }

        .blob-gold {
            bottom: -10%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: var(--gold);
            opacity: 0.10;
        }

        /* ---------- Glass card ---------- */
        .auth-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: 1rem;
            margin: 1rem;
        }

        /* ---------- Logo ---------- */
        .auth-logo {
            display: block;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            object-fit: cover;
            margin: 0 auto 1.25rem;
        }

        /* ---------- Titres ---------- */
        .auth-title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            background: linear-gradient(135deg, var(--cyan), var(--gold));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-subtitle {
            text-align: center;
            font-size: 0.8125rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        /* ---------- Formulaire ---------- */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.375rem;
        }

        .form-input {
            width: 100%;
            padding: 0.625rem 0.75rem;
            background: var(--bg-input);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.5rem;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-input::placeholder { color: var(--text-disabled); }
        .form-input:focus { border-color: var(--cyan); }

        /* ---------- Checkbox ---------- */
        .form-check {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
        }

        .form-check input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--cyan);
            cursor: pointer;
        }

        .form-check label {
            font-size: 0.8125rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        /* ---------- Bouton submit ---------- */
        .btn-submit {
            display: block;
            width: 100%;
            padding: 0.75rem 1rem;
            background: linear-gradient(135deg, var(--cyan), var(--cyan-dark));
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.9375rem;
            font-weight: 700;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .btn-submit:hover { opacity: 0.85; }
        .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ---------- Messages erreur ---------- */
        .form-error {
            display: none;
            padding: 0.625rem 0.75rem;
            background: rgba(255, 82, 82, 0.12);
            border: 1px solid rgba(255, 82, 82, 0.3);
            border-radius: 0.5rem;
            color: var(--red);
            font-size: 0.8125rem;
            margin-bottom: 1rem;
        }

        .form-error.visible { display: block; }

        /* ---------- Liens ---------- */
        .auth-link {
            display: block;
            text-align: center;
            font-size: 0.8125rem;
            color: var(--text-muted);
            margin-top: 0.75rem;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .auth-link:hover { color: var(--cyan); }
        .auth-link-cyan { color: var(--cyan); font-weight: 600; }
        .auth-link-cyan:hover { color: var(--text-primary); }

        /* ---------- Separateur ---------- */
        .auth-divider {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin: 1.25rem 0;
            color: var(--text-disabled);
            font-size: 0.75rem;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
        }

        /* ---------- Lien retour ---------- */
        .back-link {
            display: block;
            text-align: center;
            font-size: 0.8125rem;
            color: var(--text-disabled);
            margin-top: 1.5rem;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .back-link:hover { color: var(--text-secondary); }
    </style>
</head>
<body>

    <!-- Blobs decoratifs -->
    <div class="blob blob-cyan"></div>
    <div class="blob blob-gold"></div>

    <!-- Card -->
    <div class="auth-card">
        <img src="/static/images/logo-dark.jpg" alt="MIA Logo" class="auth-logo">
        <h1 class="auth-title">Connexion</h1>
        <p class="auth-subtitle">Accedez a votre dashboard MIA</p>

        <div id="login-error" class="form-error"></div>

        <form id="login-form" autocomplete="on">
            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="votre@email.com" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="password" class="form-label">Mot de passe</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="Votre mot de passe" autocomplete="current-password" required>
            </div>

            <div class="form-check">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Se souvenir de moi</label>
            </div>

            <button type="submit" class="btn-submit">Se connecter</button>
        </form>

        <a href="#" class="auth-link">Mot de passe oublie ?</a>

        <div class="auth-divider">Ou</div>

        <a href="/register" class="auth-link auth-link-cyan">Pas encore de compte ? S'inscrire</a>
        <a href="/" class="back-link">&larr; Retour au dashboard</a>
    </div>

    <script src="/static/js/auth.js"></script>
</body>
</html>
