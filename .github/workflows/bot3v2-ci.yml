# Bot 3 v2 Narrative Layer — CI/CD GitHub Actions
#
# Phase 1.0 Pro Standard Foundation.
# Cf DOCS/plans/2026-05-18-bot3-narrative-layer-spec.md
#
# Trigger : push/PR sur master ou branches feature/bot3v2-*
# Scope : tests + lint + mypy strict pour modules CORE/bot3_v2/

name: Bot 3 v2 CI

on:
  push:
    branches:
      - master
      - 'feature/bot3v2-**'
    paths:
      - 'CORE/bot3_narrative_*.py'
      - 'CORE/bot3_story_*.py'
      - 'CORE/bot3_plot_*.py'
      - 'CORE/bot3_scenario_*.py'
      - 'CORE/bot3_direction_resolver.py'
      - 'CORE/bot3_shadow_mode.py'
      - 'tests/bot3/**'
      - 'pyproject.toml'
      - '.pre-commit-config.yaml'
      - '.github/workflows/bot3v2-ci.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'CORE/bot3_narrative_*.py'
      - 'CORE/bot3_story_*.py'
      - 'CORE/bot3_plot_*.py'
      - 'CORE/bot3_scenario_*.py'
      - 'CORE/bot3_direction_resolver.py'
      - 'CORE/bot3_shadow_mode.py'
      - 'tests/bot3/**'

jobs:
  lint:
    name: Lint (ruff + black + isort)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install lint tools
        run: |
          pip install --upgrade pip
          pip install black==24.4.2 isort==5.13.2 ruff==0.5.0

      - name: Ruff check
        run: ruff check CORE/bot3_narrative_*.py CORE/bot3_story_*.py CORE/bot3_plot_*.py CORE/bot3_scenario_*.py CORE/bot3_direction_resolver.py CORE/bot3_shadow_mode.py tests/bot3/

      - name: Black check
        run: black --check CORE/bot3_narrative_*.py CORE/bot3_story_*.py CORE/bot3_plot_*.py CORE/bot3_scenario_*.py CORE/bot3_direction_resolver.py CORE/bot3_shadow_mode.py tests/bot3/

      - name: Isort check
        run: isort --check-only --profile=black CORE/bot3_narrative_*.py CORE/bot3_story_*.py CORE/bot3_plot_*.py CORE/bot3_scenario_*.py CORE/bot3_direction_resolver.py CORE/bot3_shadow_mode.py tests/bot3/

  typecheck:
    name: MyPy strict typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install mypy==1.10.0 pydantic pandas-stubs numpy
          pip install -r requirements.txt || echo "requirements.txt not found, skip"

      - name: MyPy strict
        run: |
          mypy --strict --ignore-missing-imports \
            CORE/bot3_narrative_*.py CORE/bot3_story_*.py CORE/bot3_plot_*.py \
            CORE/bot3_scenario_*.py CORE/bot3_direction_resolver.py CORE/bot3_shadow_mode.py

  tests:
    name: Pytest + coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio hypothesis pydantic numpy pandas
          pip install -r requirements.txt || echo "requirements.txt not found, skip"

      - name: Run Bot 3 v2 tests
        run: |
          pytest tests/bot3/ -v --cov=CORE --cov-report=term-missing --cov-report=xml --cov-fail-under=85 -m "bot3v2 or not bot3v2"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          flags: bot3v2
          fail_ci_if_error: false

  bot3v2-tier1-coverage:
    name: Bot 3 v2 Tier 1 modules coverage ≥90%
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov hypothesis pydantic numpy pandas
          pip install -r requirements.txt || echo "requirements.txt not found, skip"

      - name: Coverage Tier 1 modules ≥90%
        run: |
          pytest tests/bot3/ -v \
            --cov=CORE.bot3_narrative_state_machine \
            --cov=CORE.bot3_direction_resolver \
            --cov-report=term-missing \
            --cov-fail-under=90 || echo "Tier 1 coverage check warn (will be enforced after Phase 1 deploy)"
