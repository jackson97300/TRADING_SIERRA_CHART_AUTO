  delta_bar:
    producteur: "DMP C++"
    unite: contrats
    signe: direct
    controle: aucun
    mesure: "positif = acheteur ; sert de base au controle de cvd_sess_r"
  rvol_zscore:
    producteur: "DMP C++"
    unite: ratio
    signe: direct
    controle: aucun
    mesure: "z-score : min -1,96 p50 -0,29 max 4,32 sur le lot d audit"
  vix_level:
    producteur: "DMP C++"
    unite: points
    signe: aucun
    controle: aucun
    mesure: "ATTENTION : vaut 0,00 hors seance - un zero n est PAS un VIX bas"
  ts:
