# CAMPAGNE D'OMBRE 1 — ce qui est fige avant de lancer
#
# Ecrit le 06/09/2026. Chaque nombre porte la mesure qui le justifie.
# Regle : aucun seuil sans sa distribution mesuree a cote. Six confusions
# d'unites en une semaine, et deux hypotheses rendues non testables par des
# seuils hors distribution — on n'ecrit plus un nombre sans l'avoir mesure.

campagne:
  nom: ombre-1
  debut: 2026-09-08
  duree_jours_seance: 60
  unite_decision: 15min          # barres de DECISION 15 min — tout cout ou seuil
                                 # de ce fichier se lit dans cette unite. Ajoute
                                 # le 08/09 (revue Fable, bloqueur n.1) : le
                                 # fichier etait fige sur des chiffres 5 min.
  mode: SIM                      # aucun capital reel avant la lecture
  date_lecture_unique: jour 61   # personne n'ouvre le tableau avant
  attendu_pre_enregistre: "0 a 1 declencheur positif net de frais sur NQ"

# Les COMPTES ne sont jamais versionnes : ils vivent dans comptes.local.yaml,
# ignore par git. Le garde-fou a refuse le premier commit de ce fichier parce
# qu'il contenait un nom de compte — il a eu raison. Voir comptes.example.yaml.
instruments:
  ES:
    compte: ${COMPTE_ES}
    valeur_point_usd: 5.00       # MES micro
    cout_aller_retour_usd: 4.32  # Tradeify 1,82 + 1 tick/cote
    # mesure 06/09, ATR-15m median 15,11 pts = 75,55 $ -> cout 0,057 ATR-15m,
    # part MEDIANE du TP (1,5 ATR) : 3,8 % — cf seuils.yaml L5_FRAIS_TROP_LOURDS
  NQ:
    compte: ${COMPTE_NQ}
    valeur_point_usd: 2.00       # MNQ micro
    cout_aller_retour_usd: 2.82
    # mesure 06/09, ATR-15m median 101,14 pts = 202,28 $ -> cout 0,014 ATR-15m,
    # part MEDIANE du TP (1,5 ATR) : 0,9 % — cf seuils.yaml L5_FRAIS_TROP_LOURDS
  # MGC arrivera sur son propre compte quand ES et NQ seront stables. Zero ligne a changer :
  # le connecteur prend le compte par ORDRE.

# ---------------------------------------------------------------------------
# PORTES APPLIQUEES — elles bloquent
# ---------------------------------------------------------------------------
# N'entre ici que ce dont l'effet protecteur est mesure, ou ce qui releve de la
# securite elementaire (qualite des donnees, une position par instrument).

portes_appliquees:

  news_calendrier:
    actif: true
    # UNE SEULE VERITE (revue Fable, bloqueur n.2) : la porte est definie dans
    # layers/L0_interrupteur/seuils.yaml (L0_NEWS). Ce fichier POINTE, il ne
    # redecrit pas l'implementation.
    source: layers/L0_interrupteur/seuils.yaml -> porte L0_NEWS
    mesure: |
      LA MEILLEURE PORTE DU SYSTEME, et de tres loin. Devenir des rejetes :
      -4,82 ATR sur ES, -1,18 sur NQ. Le hasard rend -0,06 +/- 0,08 : elle est
      a trente ecarts-types du bruit. Elle ne ferme que 1,0 % des signaux.
      Reserve : 4 occurrences seulement sur 57 jours.

  qualite_donnees:
    actif: true
    regle: data_quality_flag == stable, window_version == w1
    mesure: "securite elementaire — pas de devenir a mesurer"

  session_cash:
    actif: true
    fenetre: 09:30-16:00 ET
    mesure: |
      Devenir des rejetes +0,18 ES / -0,03 NQ, non significatif. Conservee parce
      que hors cash les objets de reference (VA, IB, VWAP RTH) n'existent pas.

  une_position_par_instrument:
    actif: true

  stop_journalier_sim:
    actif: true
    seuil_usd: -1000
    mesure: |
      PEU PROBABLE sur NQ, improbable sur ES — MESURABLE, jamais « inerte
      par construction » (revue 08/09, A2 : ses propres chiffres disaient
      le contraire). Un SL de 1,0 ATR-15m vaut 75,55 $ sur MES et 202,28 $
      sur MNQ (medians 06/09) : 13,2 pertes d'affilee sur ES, 4,9 sur NQ —
      cinq SL NQ dans une journee a ~7 signaux n'est pas impossible. Le
      jour ou il ferme une seance, LECTURE_JOUR_61 lit ces journees A PART
      (regle 16) ; le rang du trade qui l'atteint se lit dans le journal
      (rang_du_trade + pnl cumule). Le stop reel est en observation.

  veto_gamma:
    # EN OBSERVATION — et le POURQUOI a change le 07/09 au soir : ce bloc
    # ne le redecrit PLUS (revue 08/09, A1 : le fichier fige portait le
    # verdict perime du matin « proxy, -0,48 mesure sur le proxy »,
    # RETOURNE le soir meme par la reproduction — 5 275 barres, 0 ecart,
    # entree propre). La verite vit dans UNE seule paire :
    # seuils.yaml L5_VETO_GAMMA + DECISIONS 07/09 soir. `actif: false`
    # reste le mot de Jackson (arbitrage 1 ligne avant le gel du 12/09,
    # A_FAIRE pt 16).
    actif: false
    source: layers/L0_interrupteur/seuils.yaml -> porte L5_VETO_GAMMA
    mesure: "cf seuils.yaml L5_VETO_GAMMA + DECISIONS 07/09 soir — jamais redecrit ici"

# ---------------------------------------------------------------------------
# PORTES OBSERVEES — elles journalisent « aurait bloque », elles n'agissent pas
# ---------------------------------------------------------------------------
# « Ouvrir une porte » est ce qui a tue decembre. « La mettre en observation »
# est une mesure. Un booleen par porte, et dans 60 jours on saura.

portes_observees:

  max_trades_par_jour:
    valeurs_observees: [5, 10, 20]
    mesure: |
      ETRANGLEUSE ET COUTEUSE. Elle ferme 36,4 % des signaux sur ES et 43,4 %
      sur NQ, et ses rejetes ont un devenir MEILLEUR que les retenus :
      +0,178 contre +0,161 sur ES, +0,251 contre +0,176 sur NQ.
      La regle Douglas des cinq trades vise le sur-trading emotionnel ; un bot
      n'a pas cette faille, et la porte coute. On ne bloque plus, on observe.
      Reserve : ces devenirs tombent dans l'intervalle du hasard [-0,21 ; +0,10].

  rang_du_trade_dans_la_journee:
    mesure: |
      Journalise « 6e, 11e, 21e trade du jour » sur chaque signal, sans agir.
      Dans 60 jours on saura si le 15e trade est reellement pire que le 3e —
      la question a laquelle la regle des cinq repondait sans l'avoir posee.

  defenses_du_niveau:
    # SOURCE CHANGEE le 08/09 (revue Fable, bloqueur n.3) : les compteurs C++
    # vah_touches_20b / retest_*_count disent « touche » pour « proximite »
    # (mesure : 20/20 barres touchees dans une VA de 7 pts). Observer 60 jours
    # d'un compteur qu'on sait faux ne mesurerait rien.
    # Branchement des fiches en SEMAINE 1 — SOUS RESERVE du diagnostic
    # A_FAIRE pt 11 (deux ecarts F23 nuit a diagnostiquer AVANT de se
    # servir des fiches) ; sinon `TROU_DEFENSES` journalise, jamais un
    # compteur faux en silence (revue 08/09, B3).
    source: fiches F23 (recalcul au tick), PAS les compteurs C++
    mesure: |
      NON MESURABLE SUR 57 JOURS, et c'est le resultat. En 15 min : 1re 133 /
      2e 53 / 3e 12 sur ES, rien de significatif. Refait en 5 min avec le seuil
      de defense calibre (p75 = 1,73 ATR, mesure) : 1re 258 / 2e 100 sur ES,
      273 / 58 sur NQ — toujours rien, et les deux instruments sont en desaccord
      de signe. La 3e approche n'atteint jamais 15 occurrences.
      L'intuition « on trade un niveau deja defendu sans le savoir » n'est pas
      invalidee : elle n'est pas mesurable ici. 60 jours de plus la trancheront.

  streak_et_circuit_breaker:
    valeurs_observees: {ES: 3, NQ: 2}
    mesure: "ne se declenche jamais sur 57 jours — nombre de pertes consecutives insuffisant"

  cooldowns:
    apres_gain_min: 60
    apres_perte_min: 90
    mesure: "non mesure — jamais atteint, les signaux sont trop espaces en 15 min"

  post_close_lock:
    apres_gain_s: 15
    apres_perte_s: 30

  stop_prop_firm_reel:
    seuil_usd: -200            # la vraie regle Douglas
    mesure: |
      Journalise « aurait bloque ici », sans agir. A la lecture on saura combien
      de jours il aurait coupes, et ce que les trades suivants auraient donne.

  fenetre_news_elargie:
    avant_min: 15
    apres_min: 30
    mesure: |
      La fenetre actuelle (is_news_60m) couvre 1,7 % des barres et n'a attrape
      que 4 signaux. Vu son efficacite (-4,82 ATR), l'elargir couterait peu.
      A mesurer avant d'appliquer.

# ---------------------------------------------------------------------------
# SUIVI — ce qu'on regarde chaque jour, et ce qu'on ne regarde pas
# ---------------------------------------------------------------------------

suivi:
  quotidien: [L6, entonnoir, portes hors plage]
  jamais_pendant_la_campagne: [P&L des declencheurs]

  par_session:
    decoupage_utc:
      ASIA:       "22:00-07:00"
      LONDON:     "07:00-13:30"
      US_MORNING: "13:30-16:00"
      US_MIDDAY:  "16:00-18:00"
      POWER_HOUR: "18:00-20:00"
      POST:       "20:00-22:00"
    metriques: [pnl, nombre_de_trades, win_rate, devenir_moyen]
    mesure: |
      Mesure 06/09, journee complete, 57 jours :
        ES  US_MIDDAY  169 sig  +0,276  SIGNIFICATIF
        NQ  US_MIDDAY  166 sig  +0,275  SIGNIFICATIF
        -> identiques a la troisieme decimale sur deux instruments.
        ES  POWER_HOUR 161 sig  -0,171   |  NQ  182 sig  -0,120
        -> le creneau que V1 privilegiait est le pire des deux.
        LONDON : 12 signaux, err-type 2,6 — VIDE. Les declencheurs lisent la VA,
        l'IB et le VWAP RTH, objets qui n'existent pas encore a cette heure.
        Ce n'est pas que Londres soit mauvais : rien ne le regarde.

# ---------------------------------------------------------------------------
# INTERDITS PENDANT LA CAMPAGNE
# ---------------------------------------------------------------------------

interdits:
  - toucher un seuil
  - ajouter un declencheur
  - changer une convention
  - lire le P&L avant la date de lecture
# Les idees nees pendant la campagne vont dans NEXT_CYCLE.md, pas dans le code.
