# Modele. Copier en `comptes.local.yaml` et renseigner — ce dernier est ignore
# par git et ne part JAMAIS dans le miroir public.
#
# Un nom de compte de trading n'a rien a faire dans un depot public, meme
# simule : le jour ou il passe en reel, il serait deja expose.

COMPTE_ES: "<compte de simulation pour ES>"
COMPTE_NQ: "<compte de simulation pour NQ>"
# COMPTE_MGC: "<plus tard>"

# Hote SSH du VPS pour --sync du coureur live. La VRAIE valeur (user@ip) vit
# dans comptes.local.yaml, ignore par git : une IP dans le miroir public est
# refusee par le garde-fou, et il a raison.
VPS_HOTE: "<utilisateur@hote-du-vps>"
VPS_CHEMIN_DONNEES: "<chemin des donnees live sur le VPS, forward slashes>"
