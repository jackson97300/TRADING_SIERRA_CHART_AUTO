# SEUILS L0 + L5 — la source UNIQUE des nombres et des classes.
#
# Aucun seuil dans le code. Une porte se change ici, par commit, jamais dans
# une fonction. `test_portes.py` echoue si une porte du code manque ici, ET si
# une porte declaree ici n'existe pas dans le code : le controle va dans les
# DEUX SENS, sinon la derive est silencieuse.
#
# AUCUNE MESURE DANS CE FICHIER — corrige le 06/09 apres revue.
# Une mesure vit dans `rapports/`, datee ; ce fichier POINTE vers elle et ne la
# recopie pas. La version precedente portait « ferme 93,5 % » pour
# `POSITION_OUVERTE` (le CSV disait 72,5 %) et « 41,6 % » pour `MAX_TRADES`
# (le CSV disait 0). Un chiffre recopie dans un commentaire est un chiffre qui
# pourrit : il survit au run qui l'a invalide. Le champ `mesure` ne contient
# donc plus que la QUESTION a laquelle le rapport repond.
#
# TROIS MODES
#   appliquee : elle bloque. N'y entre que ce dont l'effet protecteur est
#               mesure, ou ce qui releve de la securite elementaire.
#   observee  : elle journalise « j'aurais bloque » sans agir. « Ouvrir une
#               porte » est ce qui a tue decembre ; « la mettre en
#               observation » est une mesure.
#   absente   : la donnee n'est pas collectee, ou le seuil n'est pas mesure.
#               Journalisee `null`, jamais `false`.
#
# REGLE DURE : aucun seuil sans sa distribution mesuree — dans `rapports/`.

# INSTRUMENTS — cout aller-retour et valeur du point. Ils etaient en dur dans
# `chaine.py` et `vetos.py` : deux nombres dont on vient de mesurer qu'ils se
# trompent facilement, ecrits a deux endroits. L'unite est notee parce qu'elle
# a deja coute huit confusions d'echelle au chantier.
instruments:
  ES:
    contrat: MES              # micro E-mini S&P 500
    cout_aller_retour_usd: 4.32
    valeur_du_point_usd: 5.00
    tick: 0.25
  NQ:
    contrat: MNQ              # micro E-mini Nasdaq 100
    cout_aller_retour_usd: 2.82
    valeur_du_point_usd: 2.00
    tick: 0.25

rapports:
  portes: rapports/portes_57j.csv        # taux de rejet et devenir, par porte
  fantomes: rapports/fantomes_57j.txt    # ce que POSITION_OUVERTE coute
  atr: rapports/distributions.csv        # distributions des grandeurs seuillees

portes:

  # === FAMILLE A — QUALITE DES DONNEES : ce que je lis est-il vrai ? ========
  # Ces portes ne rejettent presque rien HORS LIGNE : `charger_jour` filtre
  # deja les barres instables en amont. Elles existent pour le LIVE, ou rien
  # ne garantit que la derniere barre lue est saine. Une porte famille A qui
  # mesure 0 en backtest n'est pas inerte — elle est hors de son terrain.
  L0_DATA_INSTABLE:
    mode: appliquee
    seuils: {attendu: stable}
    mesure: "combien de barres non stables atteignent la decision en live ?"
  L0_DATA_PERIMEE:
    mode: appliquee
    seuils: {age_max_s: 90}
    mesure: "distribution de l'age de la derniere barre au moment de decider"
  L0_DATA_INCOMPLETE:
    mode: appliquee
    seuils: {}
    mesure: "combien de barres partielles en fin de seance ?"
  L0_DATA_FENETRE_MELANGEE:
    mode: appliquee
    seuils: {}
    mesure: "combien de journees melangent w0 et w1 ? Le danger n'est pas w0 —
             tout l'historique l'est — c'est le melange dans un meme calcul."
  L0_DATA_L6_ALERTE:
    mode: appliquee
    seuils: {}
    mesure: "combien de journees ou L6 a leve une alerte ?"
  L0_DATA_COLONNE_MORTE:
    mode: appliquee
    seuils: {}
    mesure: "1 080 couples (colonne, jour) dans stale.csv ; combien touchent
             une colonne que la decision lit ?"

  # === FAMILLE B — TEMPS ET CALENDRIER : est-ce un moment ou decider ? =====
  L0_NEWS:
    mode: appliquee
    seuils: {}
    mesure: "la meilleure porte du systeme — voir rapports/portes_57j.csv"
  L0_SESSION_BLOQUEE:
    mode: appliquee
    seuils: {}
    mesure: "ouverture US, close + overnight, week-end — cf CORE/eco_calendar.py"
  L0_FERIE_CME:
    mode: appliquee
    seuils: {}
    mesure: "JAMAIS deductible des donnees : le 19/06 avait 841 barres et 12 %
             du volume, le marche etait pourtant ouvert. Seul le calendrier le
             sait — cf ../../config/sessions.yaml"
  L0_ROLLOVER:
    mode: appliquee
    seuils: {}
    mesure: "premier passage le 10/09"
  L0_PREMIERE_BARRE:
    mode: appliquee
    seuils: {rang_min: 4}      # 4 barres de 15 min = le regime est lisible
    mesure: "aucune decision avant que le regime soit lisible"
  L0_EOD_LOCKOUT:
    mode: appliquee
    seuils: {cloture_min_et: 960, marge_min: 10}   # 16:00 ET - 10 = 15:50 ET
    mesure: "seuil en MINUTES ET (DST-aware), pas UTC fige : en EST un
             cloture_utc_min aurait bloque des 14h50 ET, mangeant la barre
             15h15 de C2_EOD. REDONDANTE avec SESSION_BLOQUEE, gardee en filet."

  # === FAMILLE C — CONDITIONS DE MARCHE : le marche est-il tradable ? ======
  L0_VIX_REGIME:
    mode: appliquee
    seuils: {regime_max: 2}          # 0 <15 / 1 <=25 / 2 >25 / 3 >35
    mesure: "DORMANTE sur ce lot : le VIX a plafonne a 22,01 sur 57 jours, les
             codes 2 et 3 n'ont jamais existe. APPLIQUEE quand meme (revue du
             06/09) : elle dort, elle ne coute rien, et le jour ou elle se
             reveille c'est de la securite elementaire."
  L0_REGIME_INDETERMINE:
    mode: observee
    # 0,25 et non 1,0 (arbitrage Fable C2, 09/09) : le YAML disait 1,0 par
    # ERREUR D'UNITE (ticks divises par points dans _dist_hvl_atr) — la zone
    # morte de 1,0 n'a JAMAIS existe. Le comportement mesure le 06/09
    # (10,2 -> 1,8 bascules/jour) est celui de 0,25 ATR-15m : on ecrit ce qui
    # a ete mesure. Zero changement de comportement (conversion x0,25 dans le
    # code + seuil /4 = identite). Re-poser au cycle 2 sur distribution.
    seuils: {zone_morte_atr: 0.25}
    mesure: "zone morte autour du HVL — combien de barres sans regime lisible ?"

  # === FAMILLE D — ETAT DU RISQUE : ai-je encore le droit de perdre ? ======
  # DEUX COMPTEURS, pas un — separes le 06/09 apres revue.
  # `MAX_TRADES` lisait `n_jour`, incremente aux seuls signaux RETENUS : elle
  # compte donc les TRADES PRIS. Quand elle fermait 40 %, la position ouverte
  # n'etait pas suivie et beaucoup plus de signaux passaient ; le compteur
  # montait vite. Sa definition n'a pas change, son CONTEXTE si — mais les deux
  # grandeurs restent des informations differentes, et chacune merite son nom.
  L0_MAX_TRADES_PRIS:
    mode: observee
    seuils: {max: 5}
    mesure: "nombre de trades EXECUTES dans la journee"
  L0_RANG_DU_SIGNAL:
    mode: observee
    seuils: {max: 12}
    mesure: "rang du signal dans la journee, execute ou non — le 15e vaut-il
             moins que le 3e ? Seuil provisoire : a caler sur la distribution."
  # CORRECTION 09/09 (audit) : ces TROIS portes sont INERTES PAR CONSTRUCTION
  # dans l'etat actuel — `etat["pnl_jour"]` et `etat["fin_cooldown"]` sont
  # initialises par `chaine.etat_neuf()` et ECRITS NULLE PART (aucun trade
  # simule n'alimente le P&L en ombre). Elles rendent False en toute
  # circonstance : n=0 ne dit RIEN du marche. Ma phrase du 08/09 (« MESURABLE,
  # jamais inerte par construction ») confondait deux choses : le SEUIL est
  # atteignable (4,9 SL de 1 ATR sur NQ), mais la GRANDEUR n'est pas cablee.
  # Cablage = cycle 2 (le fantome L0_POSITION_OUVERTE porte deja un pnl_atr
  # simule — c'est la brique). Jamais pendant la campagne.
  L0_STOP_JOURNALIER:
    mode: appliquee
    seuils: {usd: -1000.0}
    mesure: "INERTE PAR CONSTRUCTION (pnl_jour jamais ecrit) — cf bloc ci-dessus.
             Le seuil lui-meme reste atteignable : si le cablage arrive et
             qu'une seance NQ ferme dessus, LECTURE_JOUR_61 regle 16 la lit A PART."
  L0_STOP_PROPFIRM:
    mode: observee
    seuils: {usd: -200.0}
    mesure: "INERTE PAR CONSTRUCTION (pnl_jour jamais ecrit). La vraie regle
             Douglas — combien de jours coupes ? — attend le cablage cycle 2."
  L0_COOLDOWN:
    mode: observee
    seuils: {apres_perte_min: 90, apres_gain_min: 60}
    mesure: "INERTE PAR CONSTRUCTION (fin_cooldown jamais ecrit). 90/60 min,
             PAS les 3/5 min de janvier (en 15 min, 3 min ne saute pas une
             barre). « il ne s'est jamais declenche en 57 jours » etait vrai
             pour une mauvaise raison : il ne POUVAIT pas."

  # === FAMILLE E — ETAT DE L'EXECUTION : puis-je passer l'ordre ? ==========
  L0_POSITION_OUVERTE:
    mode: appliquee
    seuils: {}
    mesure: "de loin la porte la plus fermee, et invisible avant le 06/09.
             Bloque l'entree, ne bloque PAS la mesure : chaque signal qu'elle
             ferme est simule en trade fantome complet — rapports/fantomes_57j.txt"
  L0_CONTRAT_INACTIF:
    # ROLLOVER 10/09, ligne B (ROLLOVER_10_09.md, DECISIONS 10/09 10h01) : les
    # fichiers du 10/09 ouvrent en U26 (ES 480 / NQ 481 lignes, 100 %) alors
    # que contrat_actif dit Z26 — le roll calendaire est celui du CME, pas de
    # Sierra. Bloquer toute la seance sur un decalage d'horloge serait un
    # faux TROU : OBSERVEE pour le 10/09, remise `appliquee` des qu'un
    # fichier OUVRE en Z26 (a verifier le 11/09 au matin, une ligne DECISIONS).
    mode: observee
    seuils: {}
    mesure: "contrat du JSONL != contrat du compte — a brancher avant le 10/09"
  L0_DTC_DECONNECTE:
    mode: appliquee
    seuils: {}
    mesure: "repli PAPER, jamais d'ordre a l'aveugle"

  # === L5 — RISQUE ==========================================================
  L5_VETO_GAMMA:
    # OBSERVEE depuis le 07/09 — et l'enquete du soir a RETOURNE le dossier :
    # gamma_block_long n'est PAS un proxy. Il est calcule par
    # gamma_veto_engine depuis dist_mq_call/put (murs collectes, A) + atr +
    # bool_gex_flip_zone (DMP natif) — REPRODUIT sur 5 275 barres stables,
    # 0 ecart. Le proxy (sierra_proxy_v2) ne produit que le label
    # mq_gamma_condition, DERIVE de bool_gex_flip_zone — jamais l'inverse.
    # Le -0,48 ATR a donc ete mesure sur une entree PROPRE. La condamnation
    # du matin etait une association de famille (SOURCES_DECLAREES corrigee).
    # RESTE LE MOT DE JACKSON : repasser appliquee = changer cette ligne,
    # un commit. Cf A_FAIRE point 16, DECISIONS 07/09 soir.
    # A1 CORRIGE EN FORME MINIMALE (passe lecture 10/09) : `_gamma` lit le
    # SENS — un LONG lit gamma_block_long, un SHORT rend un TROU
    # (gamma_block_short n'est PAS dans l'agregation 15 min). NE PAS repasser
    # appliquee AVANT la passe complete : en strict, le trou bloquerait TOUS
    # les shorts. Les longs sont mesures, les shorts non (LECTURE regle 36).
    mode: observee
    seuils: {}
    mesure: "mur gamma dans le sens du TP — voir rapports/portes_57j.csv"
  L5_VETO_RVOL_EXTREME:
    # OBSERVEE depuis le 09/09 (arbitrage Fable C3) : le z lu est celui de la
    # DERNIERE MINUTE du bloc 15 min (bot_terminal, famille ETATS .last()).
    # Mesure : NQ 64 blocages avec la derniere minute, ZERO avec la barre
    # reconstruite (moyenne ponderee volume) — 100 % d'artefact d'agregation.
    # Un veto applique qui bloque sur un artefact n'est pas une protection,
    # c'est un biais actif sur un instrument. L'agregation juste (73 / 0 /
    # 25 / 401 sur ES selon la definition) se tranche au cycle 2 SUR
    # DISTRIBUTION — pas en campagne. Re-application = ligne DECISIONS.
    mode: observee
    seuils: {zscore_max: 3.0}
    # DEUX DEFINITIONS EXISTENT, ET ELLES NE SE REMPLACENT PAS.
    #   `rvol_zscore`  volume inhabituel par rapport au passe RECENT (intraday)
    #   `rvol_r`       volume inhabituel pour CETTE MINUTE de seance, contre
    #                  les 20 jours precedents — de la saisonnalite
    # Mesure du 06/09 : sur les 59 barres ES ou |rvol_zscore| >= 3, la mediane
    # de `rvol_r` vaut 0,99 — un volume parfaitement normal. Les deux ferment
    # des ensembles quasi disjoints : 25 et 17 signaux, 2 en commun.
    # Transposer le seuil 3,0 sur `rvol_r` fermerait 0,5 % : inerte. Le
    # calibrer a 1,71 pour retrouver 6,7 % fermerait D'AUTRES barres.
    mesure: "volume relatif aberrant : ce n'est plus le meme marche.
             BASCULE VERS `rvol_r` REFUSEE PAR LA MESURE : devenir des rejetes
             `rvol_zscore` -0,009 ES / -0,036 NQ, contre `rvol_r` +0,785 /
             +0,543 — la version saisonniere fermerait des trades gagnants.
             `rvol_zscore` n'a par ailleurs aucun defaut mesurable sur ce lot :
             1 zero exact sur 21 601 barres ES brutes, 4 sur 25 999 NQ.
             `rvol_r` demande 20 jours de chauffe : 17 % des barres seraient
             incalculables, donc autant de trous supplementaires en live."
  L5_FRAIS_TROP_LOURDS:
    mode: observee
    seuils: {tp_atr: 1.5, part_max: 0.10}
    # FORMULE, ecrite ici parce qu'un ecart d'echelle a deja coute un facteur 4 :
    #     part = cout_aller_retour / (tp_atr * atr5 * valeur_du_point)
    #     ES  cout 4,32 $  valeur du point 5,00 $  (MES, micro)
    #     NQ  cout 2,82 $  valeur du point 2,00 $  (MNQ, micro)
    # `atr5` est l'ATR de la barre AGREGEE, en POINTS — en 15 min, pas en 5.
    mesure: "MESURE du 06/09 sur 20 jours, barres 15 min : atr5 ES median
             15,11 pts (p10 8,11 / p90 28,43), part des frais MEDIANE 3,8 %,
             au-dessus de 10 % sur 3,0 % des barres. NQ atr5 median 101,14 pts,
             part 0,9 %, jamais au-dessus de 10 %.
             CORRIGE UNE ERREUR : la version precedente annoncait ~20 % sur MES
             a partir d'un ATR de 2,8 points. C'etait un ATR d'une autre echelle
             — l'ATR 15 min reel est cinq fois plus grand. Huitieme confusion
             d'echelle du chantier."

# --- CE QUI N'EXISTE PAS, ET QUI NE SE DEVINE PAS --------------------------
# Une condition non collectee n'existe pas. Aucun proxy.
absentes:
  L0_SPREAD:
    raison: "aucune colonne de carnet dans le C++. `avg_bid_size`/`avg_ask_size`
             sont des tailles VAP, pas des cotations. Une ligne de C++ a ajouter
             au dumper — sans elle, L0 vit avec une porte de liquidite en moins."
  L0_HORLOGE_VPS:
    raison: "aucune mesure de derive aujourd'hui"
  L0_AGE_NIVEAUX_MQ:
    raison: "le dump Sierra est vivant, sa fraicheur n'est pas controlee"
  L0_VOL_EXTREME:
    raison: "`atr_hnorm_r` a recalculer dans recalc.py — `atr_14m_hnorm` est
             creee par feature_reduction, JAMAIS collectee. Seuil non mesure."
  L0_VIX_CHOC:
    raison: "ratio vix_level / valeur a 9h30 — distribution non mesuree.
             Un seuil sans sa distribution est une porte qu'on ne sait pas lire."
