# SEUILS L1 — la source unique des nombres du biais.
#
# Aucun seuil dans le code. AUCUNE MESURE ici non plus : les mesures vivent
# dans `rapports/`, datees. Le champ `mesure` ne porte que la QUESTION a
# laquelle le rapport repond.
#
# TOUT `null` EST UN SEUIL QUE LA MESURE N'A PAS ENCORE PRODUIT.
# `biais.charger_seuils` LEVE si un `null` est en mode `appliquee` : decider
# avec un nombre qui n'existe pas, c'est ce que le code ferait en silence
# autrement.

b1_actif: B1p          # B1p ou B1n — tranche par la SEPARATION, pas par l'elegance

composantes:

  B1p:
    mode: observee
    seuils: {z1_atr: 1.0}
    role: candidat
    # MESURE du 07/09, 60 jours, |dist_vwap_w| en ATR-15m :
    #   ES  p10 0,49  mediane 2,13  p90 5,63     NQ  p10 0,71  mediane 2,75
    #
    # DEUX CHOSES QUE LA DISTRIBUTION A MONTREES, ET QUI NE S'ATTENDAIENT PAS :
    #
    # 1. La zone morte ne sert pas a ce pour quoi elle avait ete introduite.
    #    Les bascules de cote sont DEJA rares a z1=0 : 0,65 par jour sur ES,
    #    0,52 sur NQ. Le prix reste du meme cote de la VWAP semaine presque
    #    toute la journee. Le ballottement du regime gamma — 10,2 bascules par
    #    jour — n'a pas d'equivalent ici.
    #
    # 2. B1-photo A UN AVIS TOUS LES JOURS : 60/60 a z1=0,0, a 0,5 et a 1,0.
    #    Il faut monter a z1=2,0 pour descendre a 52/60 — mais 2,0 ATR EST la
    #    mediane, une zone morte qui jette la moitie des observations.
    #
    # z1 = 1,0 est retenu pour la STABILITE (0,10 bascule/jour sur ES) et non
    # pour l'abstention, qu'aucune valeur raisonnable ne produit.
    mesure: "voir rapports/. La COUVERTURE de B1-photo est hors plage PAR
             NATURE : la spec exige moins de 95 % des jours, elle en fait
             100 %. Ce n'est pas le seuil qui est mal pose, c'est la
             composante qui ne sait pas dire « je ne sais pas » — elle decrit
             ou le prix est, elle n'oriente pas. C'est le premier argument
             mesure en faveur de B1n : un narratif PEUT s'abstenir, quand la
             reference a ete cassee sans regain."

  B1n:
    mode: observee
    seuils: {z1_atr: 1.0, tendance_fort: 1.0}
    role: candidat
    mesure: "meme cote que la photo SI le dernier test a tenu. Depend de F23.
             DUEL avec B1p : si le narratif n'ameliore pas la separation hors
             bruit, B1 reste une photo et F23 ne sert que L3."

  B4:
    mode: observee
    # UNE colonne SMT, TOUJOURS la meme (point 5 de la nuit du 08/09) : les
    # deux fichiers portent chacun leur `im_smt_divergence` et ils DIVERGENT
    # (ES -1, NQ 0 au meme ts). Reference = ES : c'est sa colonne qui a
    # detecte la divergence observee, et l'indice large est la reference
    # naturelle du spread. Revisable par commit avant le gel du 12/09 —
    # jamais « celle de l'instrument courant », qui ferait deux B4.
    seuils: {colonne_smt: im_smt_divergence, instrument_smt: ES}
    role: veto            # peut ANNULER, jamais orienter ni inverser
    mesure: "accord ES/NQ. Part de jours vetoes a mesurer. Rend 1 pour
             « accord » et 0 pour « desaccord » — ce n'est PAS un cote."

  B5:
    mode: observee
    seuils: {heure_et: "10:30"}
    role: qualificateur   # peut dire fort/faible, jamais creer ni annuler
    mesure: "ouverture contre la valeur de la veille, lue UNE FOIS a 10h30 ET :
             avant, la valeur du jour n'est pas formee et la comparaison n'a
             pas de sens. EXCLUE DE S-4 : cette regle EST la relation a la
             veille, la lire deux fois serait une fuite."

  B5b:
    mode: observee
    seuils: {barres_acceptation: 3}
    role: annulateur      # annule B5, ne dit rien d'autre
    mesure: "si le prix est reste dans la VA veille, l'ouverture hors valeur
             n'a pas ete acceptee. Rend 1 ou 0, jamais un cote."

# --- F23 : la memoire de session, partagee avec L3 -------------------------
f23:
  z_touche_atr: 0.0          # MESURE : la barre englobe le niveau
  z_reset_atr: 0.5           # MESURE : hysteresis, cf rapports
  k_reaction_barres: 4
  defense_forte: {rvol_r_min: null, reaction_atr_min: null}
  piege_volume_min: null
  mesure: "z_touche et z_reset sont MESURES (06/09) : sans hysteresis, 38 a
           53 % des barres « touchent », soit quatorze fois par jour sur la VAH
           seule — la value area contient 70 % du volume, le prix y sejourne.
           z_reset choisi sur la DISCRIMINATION : a 0,5 ATR, « deux, trois,
           quatre tests » existe dans 45,2 % des cas ; a 1,5 le compteur est un
           booleen deguise. Les seuils de defense et de piege restent null."

# --- CE QUI RESTE A ETABLIR SUR LA MESURE ----------------------------------
a_mesurer:
  couverture:
    question: "part des jours avec un cote"
    plage: [0.30, 0.95]
    pourquoi: "au-dessus de 95 % c'est un habillage du sens du marche ; en
               dessous de 30 % le biais ne sera jamais consulte."
  separation:
    question: "E[devenir | avec] - E[devenir | contre], IC bootstrap PAR JOUR"
    pourquoi_par_jour: "les signaux d'une meme journee sont correles. Un IC qui
                        les suppose independants sous-estime l'intervalle."
    etalon: "controle negatif — biais tire au sort UNE FOIS PAR JOUR, meme
             couverture. Un faux biais qui changerait a chaque barre serait
             plus facile a battre, et l'etalon trop clement."
    regle: "l'IC mesure doit exclure zero ET l'IC du controle negatif doit le
            contenir. Sinon LE BIAIS N'INFORME PAS."
  obstacle_mesure_06_09:
    constat: "les quatre declencheurs sont TOUS des fades — H3 rejet a
              l'extreme de la VA, H6 retest d'IB, H7 sweep + reclaim, H8
              absorption. Ils vendent le haut et achetent le bas ; un biais de
              tendance dit long quand le prix est haut."
    mesure: "195 signaux CONTRE pour 12 AVEC sur ES ; 202 pour 23 sur NQ."
    consequence: "la separation n'est pas mesurable sur ce lot de declencheurs :
                  le groupe « avec » est un residu de douze cas. A traiter
                  AVANT de conclure quoi que ce soit sur B1."
