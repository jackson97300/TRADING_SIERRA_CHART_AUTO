# SEUILS L5 — BARRIERES. Mesures du 07/09 (rapports/distributions_niveaux),
# 20 jours par instrument. Chaque nombre porte son origine ; un `null` sous
# `observee` est admis, sous `appliquee` le code refuse de tourner.
#
# Les PORTES L5 (veto gamma/rvol/frais) restent dans
# layers/L0_interrupteur/seuils.yaml — une seule verite, on ne demenage pas
# un fichier que la chaine lit. Ce fichier-ci ne porte que les BARRIERES.

barrieres:

  B-ATR:                       # la reference qui tourne — triple_barriere()
    mode: appliquee
    seuils: {sl_atr: 1.0, tp_atr: 1.5, expiration_barres: 20}

  B-NIV:                       # H-L5-NIVEAUX — la regle de Jackson (V1)
    mode: observee
    # Fenetre du SL : le premier niveau CONTRE dans [min, max] ATR.
    # Mesure 07/09 : le plus proche niveau est a p50 ~0,23 ATR, p75 ~0,5 —
    # QUINZE niveaux rendent le voisinage dense ; le plancher 0,5 est ce qui
    # empeche le stop d'aller dans le bruit (la lecon V1 : SL_MIN_TICKS,
    # « trop pres = sorti par le bruit »). Le plafond 1,5 = le SL budget.
    sl_fenetre_atr: [0.5, 1.5]
    # TP : premier niveau DANS le sens au-dela de tp_min, moins la marge.
    tp_min_atr: 0.5
    marge_tp_ticks: 1
    # BUFFER DE BALAYAGE, par instrument, EN ATR (revue Fable 07/09 : la
    # grandeur est dimensionnellement une distance — un buffer en ATR est
    # une PART, et une part voyage ; en ticks il ne voyageait pas, ratio
    # 5,45 aux trois quarts explique par les points-par-ATR). Mesure §2 du
    # rapport, CONVERSION EXPLICITE (huit confusions points/ticks au
    # chantier) : ES 20 t = 5,00 pts ; 5,00 / 15,11 = 0,33.
    # NQ 109 t = 27,25 pts ; 27,25 / 101,14 = 0,27. Proches, PAS
    # identiques : par instrument quand meme, re-mesures au jour 61.
    buffer_sweep_atr: {ES: 0.33, NQ: 0.27}
    plafond_sl_atr: 1.5
    plafond_tp_atr: 1.5   # le TP de reference B-ATR — un TP au-dela serait une autre barriere
    # CANDIDATS v1 : niveaux FIGES au signal, ELIGIBILITE = provenance A ou
    # reproduite SEULEMENT (revue Fable : les tiers V1 melangaient A, B non
    # reproduits — HVN/LVN, EXT_EDGE, SWING — et un quarantaine, CUR_VAH en
    # Tier 2). Les cur_* sont EXCLUS — meme quarantaine que F23 ; leur
    # entree attend une regle de stabilite (rapport §3). Jamais
    # gamma_block_* (proxy, un test l'interdit). Les tiers V1 n'informent
    # que l'ORDRE des candidats ; F23 les re-notera (`issue = tenu` par
    # niveau, donnees V3) — jamais recopies de mars.
    niveaux: [prev_vah, prev_val, prev_vpoc, ib_high, ib_low,
              pdh, pdl, ovn_high, ovn_low, mq_call, mq_put, mq_hvl]
    # CONTROLE INTERNE (revue Fable) : avec quinze niveaux le voisinage est
    # DENSE (p50 0,23 ATR) — « part de vrais niveaux » sera haute PARCE QUE
    # la liste est longue. La meme mesure tourne aussi sur la liste REDUITE
    # aux A figes ; si la solidite vient des niveaux C++, ca se verra la.
    niveaux_reduits: [prev_vah, prev_val, prev_vpoc, pdh, pdl,
                      ovn_high, ovn_low, mq_call, mq_put]
    stabilite_cur_barres: null
    mesure: "rapports/distributions_niveaux_20260907.md"

  B-NAT:                       # la sortie naturelle par famille (constat 0.1)
    mode: observee
    cible_par_famille:
      H3-VPOC: cur_vpoc_fige   # deja la barriere du runner, FIGEE (DECISIONS)
      H2p: vwap_rth
      H6p: ib_mid
      H8p: va_opposee
    sl_atr: 1.0                # le SL reste B-ATR — seule la cible change
    plafond_tp_atr: 1.5        # le defaut quand la cible manque

frais:
  source: config/campagne.yaml -> instruments    # jamais recopie
