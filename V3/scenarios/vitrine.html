<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Narrateur de séance</title>
<style>
  :root { --fond:#111; --texte:#d8d8d8; --gris:#6a6a6a; --ok:#7fd48a; --non:#e08a7a; --neutre:#c9b45c; --cadre:#2a2a2a; }
  body { margin:0; padding:10px 14px; background:var(--fond); color:var(--texte); font:13px/1.35 Consolas, "Courier New", monospace; }
  h1 { font-size:14px; margin:0 0 6px; letter-spacing:.5px; }
  .bandeau { background:#3a2f12; color:#f0d27a; padding:3px 8px; margin-bottom:8px; font-size:11px; }
  .muet { color:var(--gris); }
  .gris * { color:var(--gris) !important; }
  .sym { border:1px solid var(--cadre); padding:8px 10px; margin-bottom:10px; }
  .titre { font-size:15px; font-weight:bold; }
  .valide { color:var(--ok); } .invalide { color:var(--non); } .en_cours { color:var(--gris); }
  table { border-collapse:collapse; width:100%; margin-top:6px; }
  td, th { padding:1px 6px; text-align:left; white-space:nowrap; }
  th { color:var(--gris); font-weight:normal; border-bottom:1px solid var(--cadre); }
  .cible { color:var(--ok); } .invalidation { color:var(--non); } .pullback { color:var(--neutre); } .rejet, .continuation { color:#8ab4e0; }
  .bloc { margin-top:6px; } .bloc b { color:var(--gris); font-weight:normal; }
  .barre { display:flex; gap:8px; align-items:center; margin-bottom:6px; font-size:11px; color:var(--gris); }
  button { background:#222; color:var(--texte); border:1px solid #444; padding:2px 8px; font:inherit; cursor:pointer; }
  form.noter { display:none; margin-top:8px; padding:8px; border:1px dashed #444; }
  form.noter input, form.noter select { background:#1a1a1a; color:var(--texte); border:1px solid #444; font:inherit; padding:2px 4px; margin:2px 4px 2px 0; }
</style>
</head>
<body>
<div class="barre">
  <span id="jour"></span><span id="hb"></span><span id="src"></span>
  <button id="btn-muet" type="button">muet</button>
  <button id="btn-noter" type="button">NOTER</button>
  <span id="msg"></span>
</div>
<div id="bandeau" class="bandeau" hidden>NON MESURÉ w1 — les nombres du lot sont sur un profil antérieur (w0)</div>
<form class="noter" id="form-noter">
  <input name="heure_et" placeholder="heure_et" size="6"><input name="sym" placeholder="sym" size="3">
  <select name="side"><option value="">side</option><option>long</option><option>short</option><option>plat</option></select>
  <input name="prix_entree" placeholder="entrée" size="8"><input name="prix_sortie" placeholder="sortie" size="8">
  <input name="issue" placeholder="issue" size="6"><input name="pourquoi" placeholder="pourquoi (dix mots)" size="34">
  <select name="scenario" id="sel-scenario"></select><select name="zone" id="sel-zone"></select>
  <input name="jour" type="hidden" id="noter-jour"><button type="submit">écrire la ligne</button>
</form>
<div id="syms"></div>
<script>
// AUCUN calcul ici : la page affiche ce que l'écrivain a écrit (SPEC_VITRINE 2).
const R = 15000;
function h(s){ return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function ligneZone(z){
  return `<tr class="${h(z.role)}"><td>${h(z.nom)}${z.provisoire ? " ~" : ""}</td><td>${z.prix}</td><td>${z.bas} – ${z.haut}</td>` +
         `<td>${h(z.role)}</td><td>${h(z.etat)} ${z.n_tests}t/${z.n_tenues}</td><td>${z.dist_ticks > 0 ? "+" : ""}${z.dist_ticks} t</td>` +
         `<td>${(z.setups_armes || []).map(s => h(s.setup || s)).join(", ")}</td></tr>`;
}
function bloc(sym, d, muet){
  const cls = (d.etat_scenario === "valide" && !muet) ? "valide" : (d.etat_scenario === "invalide" ? "invalide" : "en_cours");
  const rec = [...d.validations.map(v => `validé ${h(v.quoi)} sur ${h(v.zone)}`), ...d.invalidations.map(v => `invalidé ${h(v.quoi)} sur ${h(v.zone)}`)];
  const al = d.alertes.map(a => `${h(a.heure_et)} ${h(a.texte)}`);
  const so = d.sorties ? Object.entries(d.sorties).map(([k, s]) => `${k} : ${h(s.texte)}`).join("<br>") : "rien ne s'arme (scénario non validé)";
  return `<div class="sym ${(muet || d.etat_scenario !== "valide") ? "gris" : ""}">
    <div class="titre ${cls}">${h(sym)} ${h(d.heure_et)} — ${h(d.titre)}</div>
    <div class="bloc"><b>séquence</b> ${d.sequence.map(h).join(" › ")}</div>
    <div class="bloc"><b>ouvre</b> ${h(d.position_ouverture)} · ${h(d.type_ouverture)} · <b>côté HVL</b> ${d.cote_hvl > 0 ? "au-dessus" : d.cote_hvl < 0 ? "en dessous" : "—"}` +
    (d.range ? ` · <b>IB</b> ${h(d.range.etat)} ${d.range.largeur_atr} ATR, tests ${d.range.n_tests_haut}/${d.range.n_tests_bas}, pression ${d.range.pression ?? "—"}` : "") + `</div>
    <table><tr><th>zone</th><th>prix</th><th>bande</th><th>rôle</th><th>mémoire</th><th>dist</th><th>ce qui tirerait ici</th></tr>${d.zones.map(ligneZone).join("")}</table>
    <div class="bloc"><b>dernière heure</b> ${rec.length ? rec.map(h).join(" · ") : "rien"}</div>
    <div class="bloc"><b>ne se trade pas</b> ${d.ce_qui_ne_se_trade_pas.map(x => h(x.setup) + " (" + h(x.raison) + ")").join(" · ") || "—"}</div>
    <div class="bloc"><b>sorties du scénario</b><br>${so}</div>
    <div class="bloc"><b>alertes</b> ${al.length ? al.join(" · ") : "aucune"}</div>
  </div>`;
}
async function rafraichir(){
  try {
    const r = await fetch("/etat.json", {cache:"no-store"}); const e = await r.json();
    document.getElementById("jour").textContent = e.jour + " · grammaire " + (Object.values(e.sym)[0]?.grammaire_version || "?");
    document.getElementById("hb").textContent = e.ecrivain_muet ? "ÉCRIVAIN MUET (" + (e.heartbeat_age_s ?? "absent") + " s)" : "écrivain " + e.heartbeat_age_s + " s";
    document.getElementById("hb").className = e.ecrivain_muet ? "invalide" : "";
    document.getElementById("src").textContent = e.source === "rejeu" ? "source : rejeu du soir" : "";
    document.getElementById("btn-muet").textContent = e.muet ? "muet ✓" : "muet";
    document.getElementById("bandeau").hidden = !e.non_mesure_w1;
    document.getElementById("noter-jour").value = e.jour;
    const syms = document.getElementById("syms");
    syms.innerHTML = Object.entries(e.sym).map(([s, d]) => bloc(s, d, e.ecrivain_muet)).join("") || "<div class='muet'>aucune barre complète aujourd'hui</div>";
    syms.className = e.ecrivain_muet ? "gris" : "";
    const sc = document.getElementById("sel-scenario"), zo = document.getElementById("sel-zone");
    const scs = new Set(), zs = new Set();
    Object.values(e.sym).forEach(d => { scs.add(d.scenario_en_cours); d.bascules.forEach(b => scs.add(b.de)); d.zones.forEach(z => zs.add(z.nom)); });
    sc.innerHTML = [...scs].map(x => `<option>${h(x)}</option>`).join("") + "<option value='autre'>autre</option>";
    zo.innerHTML = "<option value=''>zone</option>" + [...zs].map(x => `<option>${h(x)}</option>`).join("") + "<option value='autre'>autre</option>";
  } catch (err) { document.getElementById("hb").textContent = "vitrine : pas de données (" + err + ")"; }
}
document.getElementById("btn-muet").onclick = async () => { await fetch("/muet", {method:"POST"}); rafraichir(); };
document.getElementById("btn-noter").onclick = () => { const f = document.getElementById("form-noter"); f.style.display = f.style.display === "block" ? "none" : "block"; };
document.getElementById("form-noter").onsubmit = async (ev) => {
  ev.preventDefault();
  const r = await fetch("/noter", {method:"POST", body: new URLSearchParams(new FormData(ev.target))});
  const j = await r.json();
  document.getElementById("msg").textContent = j.ok ? "ligne écrite" + (j.ligne.hors_scenario === "true" ? " (HORS_SCENARIO)" : "") : "refusé : " + j.erreur;
  if (j.ok) ev.target.reset();
};
rafraichir(); setInterval(rafraichir, R);
</script>
</body>
</html>
